name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libglib2.0-bin

      - name: ESM parse check
        run: make check

      - name: Lint JavaScript
        run: |
          npm ci --ignore-scripts 2>/dev/null || true
          npx --yes eslint@9 --ext .js,.mjs . --ignore-pattern build/ --ignore-pattern node_modules/

      - name: Lint shell scripts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck install.sh uninstall.sh

      - name: Compile GSettings schema
        run: glib-compile-schemas schemas/

      - name: Unit tests
        run: node --test tests/*.test.mjs

      - name: Validate translations
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gettext
          make translations
          for po in po/*.po; do msgfmt -c -o /dev/null "$po"; done

      - name: Lint bridge (ruff)
        run: |
          python3 -m pip install --user --quiet ruff
          ruff check homelab/bambu-bridge

      - name: Unit tests (bridge)
        run: |
          python3 -m pip install --user --quiet -r homelab/bambu-bridge/requirements-dev.txt
          python3 -m pytest homelab/bambu-bridge/tests
