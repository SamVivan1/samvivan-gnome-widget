name: Bug report
description: Something is broken
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting! Please fill in what you can — logs help a lot.
  - type: input
    id: shell-version
    attributes:
      label: GNOME Shell version
      description: Output of `gnome-shell --version`
      placeholder: "50.1"
    validations:
      required: true
  - type: input
    id: distro
    attributes:
      label: Distro
      placeholder: "Fedora 43 / Ubuntu 25.10 / Arch"
    validations:
      required: false
  - type: input
    id: ext-version
    attributes:
      label: Extension version
      description: Release tag or commit hash
      placeholder: "v1.0.0"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: "1. Enable the Photos widget\n2. Set source to Immich\n3. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant output of `journalctl -b /usr/bin/gnome-shell | grep desktop-widget`
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for duplicates
        - label: I logged out and back in after installing (Wayland)
